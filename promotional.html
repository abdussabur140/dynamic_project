<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .promo-container {
            text-align: center;
            display: none; /* Keep blank page initially */
        }

        .promo-container h1 {
            font-size: 32px;
            color: #222;
        }

        .promo-container p {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

<body>

    <!-- Add your promotional content here later -->
    <div class="promo-container">
        <h1>Special Offer</h1>
        <p>Welcome to our promotion page.</p>
    </div>

</body>
</html>
